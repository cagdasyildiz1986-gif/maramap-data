name: Marmara akinti verisi

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Toolbox kur
        run: |
          pip install "copernicusmarine==1.3.5" xarray netcdf4 scipy

      - name: Copernicus kimlik dogrulama
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.CMEMS_USER }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.CMEMS_PASS }}
        run: |
          python -c "
          import copernicusmarine, os
          u = os.environ['COPERNICUSMARINE_SERVICE_USERNAME']
          p = os.environ['COPERNICUSMARINE_SERVICE_PASSWORD']
          print(f'Kullanici: {u[:3]}***')
          copernicusmarine.login(username=u, password=p, overwrite_configuration_if_exists=True)
          print('Login basarili')
          "

      - name: Veriyi cek
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.CMEMS_USER }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.CMEMS_PASS }}
        run: python tools/fetch_currents.py

      - name: Commit & push
        run: |
          git config user.name "mavimera-bot"
          git config user.email "bot@mavimera.com"
          git add currents.json
          git diff --cached --quiet || git commit -m "Akinti guncellendi $(date -u +%F)"
          git push
