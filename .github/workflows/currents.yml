name: Marmara akinti verisi

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Toolbox kur
        run: pip install copernicusmarine xarray netcdf4 scipy

      - name: Copernicus login
        env:
          CM_USER: ${{ secrets.CMEMS_USER }}
          CM_PASS: ${{ secrets.CMEMS_PASS }}
        run: |
          copernicusmarine login --username "$CM_USER" --password "$CM_PASS" --force-overwrite

      - name: Veriyi cek
        run: python tools/fetch_currents.py

      - name: Commit & push
        run: |
          git config user.name "mavimera-bot"
          git config user.email "bot@mavimera.com"
          git add currents.json
          git diff --cached --quiet || git commit -m "Akinti guncellendi $(date -u +%F)"
          git push
